<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirschli</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍒</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #fbbdd4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 32px;
        }

        @media (max-width: 430px) {
            body { padding: 20px 20px; }
            .card { padding: 40px 16px 52px; }
        }

        /* ── White Card ── */
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 32px 52px;
            max-width: 520px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15);
        }

        /* ── Avatar ── */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* ── Heading ── */
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 14px;
        }

        /* ── Bio ── */
        .bio {
            font-size: 15px;
            color: #4a4a4a;
            line-height: 1.65;
            margin-bottom: 20px;
        }

        /* ── Instagram Icon ── */
        .social-icon {
            margin-bottom: 24px;
        }
        .social-icon svg {
            width: 22px;
            height: 22px;
        }

        /* ── Turnstile ── */
        .verify-box {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        /* ── Button ── */
        .btn {
            display: block;
            width: 300px;
            background-color: #e8005a;
            color: #ffffff;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s cubic-bezier(0,0,0.5,1);
            pointer-events: none;
            opacity: 0.5;
        }
        .btn.active {
            pointer-events: auto;
            opacity: 1;
        }
        .btn:hover { background-color: #bf004a; }
        .btn:active { transform: scale(0.96); }

        .hidden { display: none !important; }

        /* ── Spinner shown while verifying ── */
        .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(227,90,134,0.25);
            border-top-color: #e35a86;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
            display: none;
        }
        .spinner.show { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Error ── */
        .error {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #b71c1c;
            background: rgba(183,28,28,0.08);
            padding: 10px 14px;
            border-radius: 8px;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>

    <div class="card">

        <!-- Profile Picture -->
        <img src="mee.png" alt="Profilbild" class="avatar">

        <h1>Urlaub mit Kirschli 🌴</h1>

        <p class="bio">Wanna join my adventure? 🍒<br>Show me you're human first!</p>

        <!-- Instagram Icon -->
        <div class="social-icon">
            <a href="https://www.instagram.com/urlaubmitkirschli" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="1" fill="#1a1a1a" stroke="none"/>
                </svg>
            </a>
        </div>

        <!-- Turnstile widget -->
        <div class="verify-box">
            <div class="cf-turnstile"
                 data-sitekey="0x4AAAAAADNdTq9RTnANZ8ZZ"
                 data-callback="onTurnstileSuccess"
                 data-error-callback="onTurnstileError"
                 data-expired-callback="onTurnstileExpired">
            </div>
        </div>

        <!-- Spinner shown during server verification -->
        <div id="spinner" class="spinner"></div>

        <!--
            Button is rendered but visually disabled until verification succeeds.
            It has no href by default — clicking triggers a JS redirect via fetch,
            so the destination URL is never exposed in the DOM before verification.
        -->
        <button id="target-btn" class="btn" disabled aria-disabled="true" aria-label="Weiterleitung nach Verifizierung">
            Join Now
        </button>

        <div id="error-msg" class="error" role="alert"></div>
    </div>

    <script>
        // ── State ───────────────────────────────────────────────────────────
        let verified = false;

        // ── Turnstile callbacks ─────────────────────────────────────────────
        async function onTurnstileSuccess(token) {
            if (verified) return; // guard against double-fire
            showSpinner(true);
            clearError();

            try {
                const res = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token }),
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    verified = true;
                    activateButton();
                } else {
                    showError(data.message || 'Verifizierung fehlgeschlagen. Bitte erneut versuchen.');
                    resetTurnstile();
                }
            } catch (err) {
                console.error('Verification error:', err);
                showError('Ein Fehler ist aufgetreten. Bitte erneut versuchen.');
                resetTurnstile();
            } finally {
                showSpinner(false);
            }
        }

        function onTurnstileError() {
            showError('Turnstile-Fehler. Bitte Seite neu laden.');
        }

        function onTurnstileExpired() {
            verified = false;
            deactivateButton();
            showError('Verifizierung abgelaufen. Bitte erneut bestätigen.');
            resetTurnstile();
        }

        // ── Button logic ─────────────────────────────────────────────────────
        function activateButton() {
            const btn = document.getElementById('target-btn');
            btn.classList.add('active');
            btn.disabled = false;
            btn.setAttribute('aria-disabled', 'false');
            btn.addEventListener('click', handleGo, { once: true });
        }

        function deactivateButton() {
            const btn = document.getElementById('target-btn');
            btn.classList.remove('active');
            btn.disabled = true;
            btn.setAttribute('aria-disabled', 'true');
        }

        /**
         * Navigate to /api/go. The server checks the HMAC-signed cookie
         * and will redirect to the target or back to / if invalid.
         * Using window.location.href means the cookie is sent automatically.
         */
        function handleGo(e) {
            e.preventDefault();
            if (!verified) return;
            window.location.href = '/api/go';
        }

        // ── Helpers ──────────────────────────────────────────────────────────
        function showSpinner(on) {
            document.getElementById('spinner').classList.toggle('show', on);
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('show');
        }

        function clearError() {
            const el = document.getElementById('error-msg');
            el.textContent = '';
            el.classList.remove('show');
        }

        function resetTurnstile() {
            if (window.turnstile) window.turnstile.reset();
        }
    </script>
</body>
</html>
